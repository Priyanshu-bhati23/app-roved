[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-roved"
version = "0.1.0"
description = "Static App Store compliance checker for iOS builds with provenance-labelled findings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
approved = "approved.cli:main"

[tool.setuptools.packages.find]
include = ["approved*"]

[tool.setuptools.package-data]
approved = ["data/*.yaml", "data/knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File()/Query() defaults are the documented idiom
